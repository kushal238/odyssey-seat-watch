name: notify-relay
on:
  push:
    branches: ["**"]
    paths:
      - "notify/**"
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Forward changed/added notify files to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- notify/ 2>/dev/null | grep '\.md$' | grep -v README || true)
          [ -z "$FILES" ] && FILES=$(ls notify/*.md 2>/dev/null | grep -v README | head -3)
          for f in $FILES; do
            [ -f "$f" ] || continue
            title=$(basename "$f" .md | tr '-' ' ')
            curl -s -H "Title: Agent: $title" -H "Priority: high" -H "Tags: robot" \
              --data-binary @"$f" "https://ntfy.sh/$NTFY_TOPIC"
            echo "relayed $f"
          done
