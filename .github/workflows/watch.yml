name: seat-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_ping:
        description: "send a test push from the cloud"
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright (for cookie self-minting)
        run: |
          pip -q install playwright
          playwright install --with-deps chromium 2>&1 | tail -1
      - name: Check seats every 60s
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AMC_COOKIES: ${{ secrets.AMC_COOKIES }}
          TEST_PING: ${{ github.event.inputs.test_ping || '0' }}
        run: python3 cloud_check.py
      - name: Dispatch successor (self-perpetuating chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -le 20260810 ]; then
            gh workflow run seat-watch --repo ${{ github.repository }} || true
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name "seat-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -X ours && git push)
