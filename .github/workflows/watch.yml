name: seat-watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check seats (fast path, no browser)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AMC_COOKIES: ${{ secrets.AMC_COOKIES }}
        run: python3 cloud_check.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "seat-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
